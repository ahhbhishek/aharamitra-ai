[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aharamitra"
version = "0.2.0"
description = "AI-Based Food Risk & Portion Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek" }]
keywords = ["machine-learning", "xgboost", "health", "nutrition", "diabetes", "glycemic-load"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.12",
    "optuna>=3.5",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "structlog>=24.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.3", "isort>=5.13", "nbstripout>=0.7"]

[project.scripts]
aharamitra = "aharamitra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aharamitra = ["*.json"]

# --- Tooling config ---------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
